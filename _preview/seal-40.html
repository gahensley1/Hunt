<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What 40px actually looks like</title>
<style>
body{margin:0;background:#cfc4ae;font-family:ui-monospace,Consolas,monospace;padding:22px;color:#2b2119}
.sheet{max-width:560px;margin:0 auto 22px;background:#EDE4D3;border-radius:16px;padding:18px;
  box-shadow:0 10px 30px rgba(30,28,26,.22)}
h2{font-family:Georgia,serif;font-size:17px;margin:0 0 4px}
p{font-size:11.5px;line-height:1.6;color:#5a4a34;margin:0 0 14px}
.pair{display:flex;gap:18px;flex-wrap:wrap}
figure{margin:0;background:#fff8ec;border:1px solid rgba(30,28,26,.14);border-radius:12px;padding:12px;text-align:center}
figcaption{font-size:10px;color:#7a6a55;margin-top:8px;line-height:1.5}
canvas{display:block;image-rendering:pixelated;border:1px solid rgba(30,28,26,.15);background:#fff8ec}
.true{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:10px}
.slot{flex:0 0 40px;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.slot img{max-width:40px;max-height:40px;width:auto;height:auto;object-fit:contain;display:block}
b{color:#8a3324}
</style></head><body>

<div class="sheet">
  <h2>The wax seal at 40px, magnified 8&times;</h2>
  <p>Each mark below is drawn into a real 40&times;40 slot exactly as the roster does it, then blown
  up eight times with smoothing off. <b>These are the true pixels a detective sees</b> &mdash; not a
  scaled-up copy of the source art. The small version underneath each one is life size.</p>
  <div class="pair" id="out"></div>
</div>

<script>
const marks = [
  ["waxseal.webp",            "ENVELOPE &mdash; the cut you chose"],
  ["wax-shipped.webp",        "DISC ALONE &mdash; what 32n ships"]
];
const wrap = document.getElementById('out');

function load(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.src=src; }); }

(async () => {
  for (const [file, label] of marks) {
    const src = file === "waxseal.webp" ? "../art/seals/waxseal.webp" : file;
    const im = await load(src);
    const s = Math.min(40/im.width, 40/im.height);
    const w = Math.round(im.width*s), h = Math.round(im.height*s);

    const c = document.createElement('canvas'); c.width = 40; c.height = 40;
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
    x.drawImage(im, (40-w)/2, (40-h)/2, w, h);

    const big = document.createElement('canvas'); big.width = 320; big.height = 320;
    const bx = big.getContext('2d'); bx.imageSmoothingEnabled = false;
    bx.drawImage(c, 0, 0, 320, 320);

    const fig = document.createElement('figure');
    fig.appendChild(big);
    const cap = document.createElement('figcaption');
    cap.innerHTML = label + "<br>source " + im.width + "&times;" + im.height +
                    " &rarr; drawn at <b>" + w + "&times;" + h + "</b>";
    fig.appendChild(cap);
    const t = document.createElement('div');
    t.className = 'true';
    t.innerHTML = '<span style="font-size:10px;color:#7a6a55">life size &rarr;</span>' +
                  '<span class="slot"><img src="' + src + '" alt=""></span>';
    fig.appendChild(t);
    wrap.appendChild(fig);
  }
})();
</script>
</body></html>
