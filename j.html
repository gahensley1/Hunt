<p>Opening the case&hellip;<br><a id="fallback" href="./">Tap here if nothing happens</a></p>
<script>
(function(){
  var m=String(location.hash||location.search||"").match(/case=(\d{6})/);
  var dest="./" + (m ? "#case="+m[1] : "");
  document.getElementById("fallback").setAttribute("href",dest);
  location.replace(dest);
})();
</script>
